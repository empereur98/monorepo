spring.application.name=taskManager

# Database Configuration - H2 file-based for local development
spring.datasource.url=jdbc:h2:file:./data/taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=your_32_character_minimum_secret_key_here_please_change_this
jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:49286,http://127.0.0.1:49286

# Logging Configuration
logging.level.com.dhi.taskmanager=INFO
logging.level.org.springframework.web=INFO
